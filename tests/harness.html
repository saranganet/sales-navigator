<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sales Navigator Scraper - Fixture Verification Harness</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --accent: #38bdf8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: #14532d;
      color: #86efac;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .test-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .test-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .test-card-title {
      font-weight: 700;
      font-size: 16px;
    }
    .badge-pass {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    th {
      color: var(--muted);
      width: 180px;
    }
    td.val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #e2e8f0;
    }
    td.status-icon {
      width: 40px;
      text-align: center;
    }
    .csv-preview {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #cbd5e1;
      white-space: pre-wrap;
    }
    iframe {
      width: 100%;
      height: 200px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      margin-top: 16px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sales Navigator Scraper — Extractor Validation</h1>
    <div class="subtitle">
      Verifying exact DOM cases from live Sales Navigator DevTools inspection.
    </div>

    <div id="summaryBox" style="margin-bottom: 20px;">
      <span class="status-badge" id="summaryBadge">Running extraction tests…</span>
    </div>

    <div id="resultsGrid" class="grid"></div>

    <h2 style="font-size: 18px; margin-top: 32px; color: var(--accent);">Exported CSV Preview</h2>
    <pre id="csvBox" class="csv-preview">Generating CSV…</pre>

    <h3 style="font-size: 15px; color: var(--muted); margin-top: 24px;">Underlying Test Fixture DOM</h3>
    <iframe id="fixtureFrame" src="fixtures/sales-nav-fixture.html"></iframe>
  </div>

  <script src="../content/selectors.js"></script>
  <script src="../content/extractor.js"></script>
  <script src="../utils/csv-export.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const iframe = document.getElementById('fixtureFrame');
      iframe.onload = () => {
        runValidation(iframe.contentDocument);
      };
    });

    function runValidation(doc) {
      const cards = [...doc.querySelectorAll('.search-results__result-item')];
      const records = cards.map(c => SNScraper.extractor.extractCard(c));
      
      console.log('Extracted records:', records);

      const expected = [
        {
          name: 'Case 1: Ciel JM P. (Owner, DOPT, Seoul)',
          expected: {
            fullName: 'Ciel JM P.',
            firstName: 'Ciel',
            lastName: 'JM P.',
            jobTitle: 'Owner',
            companyName: 'DOPT',
            companyDomain: '',
            location: 'Seoul, South Korea',
            connectionDegree: '3rd',
            profileUrl: 'https://www.linkedin.com/in/ACwAACiel'
          }
        },
        {
          name: 'Case 2: David Choi (Owner / CEO, Standard Trading Limited, Gyeonggi)',
          expected: {
            fullName: 'David Choi',
            firstName: 'David',
            lastName: 'Choi',
            jobTitle: 'Owner / CEO',
            companyName: 'Standard Trading Limited',
            companyDomain: 'standardtrading.co.kr',
            location: 'Gyeonggi, South Korea',
            connectionDegree: '3rd',
            profileUrl: 'https://www.linkedin.com/in/ACwAADavid'
          }
        },
        {
          name: 'Case 3: DH Shon (Senior Principal Engineer, Samsung Electronics, South Korea)',
          expected: {
            fullName: 'DH Shon',
            firstName: 'DH',
            lastName: 'Shon',
            jobTitle: 'Senior Principal Engineer',
            companyName: 'Samsung Electronics',
            companyDomain: 'samsung.com',
            location: 'South Korea',
            connectionDegree: '1st',
            profileUrl: 'https://www.linkedin.com/in/ACwAADHShon'
          }
        }
      ];

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';
      let allPass = true;

      expected.forEach((test, idx) => {
        const rec = records[idx] || {};
        const cardDiv = document.createElement('div');
        cardDiv.className = 'test-card';

        let testPass = true;
        let rowsHtml = '';

        for (const [field, expectedVal] of Object.entries(test.expected)) {
          const actualVal = rec[field] || '';
          const match = actualVal.trim().toLowerCase() === expectedVal.trim().toLowerCase();
          if (!match) {
            testPass = false;
            allPass = false;
          }
          rowsHtml += `
            <tr>
              <th>${field}</th>
              <td class="val">${escapeHtml(actualVal)}</td>
              <td class="status-icon">${match ? '✅' : '❌'}</td>
            </tr>
          `;
        }

        cardDiv.innerHTML = `
          <div class="test-card-header">
            <span class="test-card-title">${test.name}</span>
            <span class="${testPass ? 'badge-pass' : 'badge-fail'}">${testPass ? 'PASSED' : 'FAILED'}</span>
          </div>
          <table>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
        grid.appendChild(cardDiv);
      });

      const summaryBadge = document.getElementById('summaryBadge');
      if (allPass) {
        summaryBadge.textContent = 'All Extractor Tests Passed (100% Accuracy)';
        summaryBadge.style.background = '#14532d';
        summaryBadge.style.color = '#86efac';
      } else {
        summaryBadge.textContent = 'Some Extraction Assertions Failed';
        summaryBadge.style.background = '#7f1d1d';
        summaryBadge.style.color = '#fca5a5';
      }

      if (globalThis.SNSCSV && records.length) {
        const csv = globalThis.SNSCSV.toCSV(records);
        document.getElementById('csvBox').textContent = csv;
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
